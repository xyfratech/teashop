<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tea Shop Manager">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kutyo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kutyo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #F6F5F0;
      --box: #B9EFCB;
      --ink: #06251A;
      --tea: #C8802B;
      --title: #191C1A;
      --muted: #6F7970;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191C1A;
        --box: #26463A;
        --ink: #B9EFCB;
        --tea: #E0A057;
        --title: #E1E3DE;
        --muted: #89938C;
      }
    }

    html, body { margin: 0; padding: 0; background: var(--bg); }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      transition: opacity .4s ease;
    }
    #loading.loaded { opacity: 0; pointer-events: none; }

    #loading .cup-box {
      width: 112px;
      height: 112px;
      border-radius: 28px;
      background: var(--box);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading svg { width: 76px; height: 76px; display: block; }

    #loading .stroke {
      fill: none;
      stroke: var(--ink);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #loading .chai { animation: chai-fill 2.2s ease-in-out infinite; }
    #loading .chai * { fill: var(--tea); }
    #loading .steam {
      fill: none;
      stroke: var(--ink);
      stroke-width: 3;
      stroke-linecap: round;
      opacity: .35;
      animation: chai-steam 2.2s ease-in-out infinite;
    }
    #loading .steam.s2 { animation-delay: .5s; }

    #loading .title {
      margin-top: 20px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--title);
    }
    #loading .sub {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    @keyframes chai-fill {
      0%, 8%  { transform: translateY(50px); opacity: 1; }
      70%     { transform: translateY(4px);  opacity: 1; }
      86%     { transform: translateY(4px);  opacity: 1; }
      100%    { transform: translateY(4px);  opacity: 0; }
    }
    @keyframes chai-steam {
      0%, 100% { transform: translateY(0);    opacity: .35; }
      50%      { transform: translateY(-3px); opacity: .12; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .chai  { animation: none; transform: translateY(12px); opacity: 1; }
      #loading .steam { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Loading Tea Shop Manager">
    <div class="cup-box">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="cupClip">
            <path d="M20 30 H72 L63 82 Q46 88 29 82 Z"/>
          </clipPath>
        </defs>

        <!-- chai: rises to fill the cup, then fades so the loop restarts unseen -->
        <g clip-path="url(#cupClip)">
          <g class="chai">
            <rect x="0" y="28" width="100" height="70"/>
            <ellipse cx="46" cy="28" rx="26" ry="3"/>
          </g>
        </g>

        <!-- steam -->
        <path class="steam s1" d="M40 24 q6 -5 0 -10 q-6 -5 0 -10"/>
        <path class="steam s2" d="M54 24 q6 -5 0 -10 q-6 -5 0 -10"/>

        <!-- cup, handle, saucer -->
        <path class="stroke" d="M72 40 C96 40 96 67 66 66"/>
        <path class="stroke" d="M20 30 H72 L63 82 Q46 88 29 82 Z"/>
        <path class="stroke" d="M14 89 Q46 100 78 89"/>
      </svg>
    </div>
    <div class="title">kutyo</div>
    <div class="sub">brewing&hellip;</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {
      var el = document.getElementById('loading');
      if (!el) return;
      var gone = false;
      function done() {
        if (gone) return;
        gone = true;
        el.classList.add('loaded');
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 450);
      }
      window.addEventListener('flutter-first-frame', done);
      // Safety net in case the event is missed.
      setTimeout(done, 20000);
    })();
  </script>
</body>
</html>
